<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل متابعة بطلات الاستدامة</title>
    <style>
        :root {
            --primary-color: #006b3f; /* لون أخضر السعودية */
            --secondary-color: #00a651;
            --accent-color: #f39c12; /* لون ذهبي */
            --text-color: #333;
            --bg-color: #f9f9f9;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--secondary-color);
            text-align: center;
            margin-top: 5px;
            font-weight: normal;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        #add-student {
            background-color: var(--primary-color);
            color: #fff;
        }

        #add-student:hover {
            background-color: var(--secondary-color);
        }

        #clear-all {
            background-color: #e74c3c; /* لون أحمر */
            color: #fff;
        }

        #clear-all:hover {
            background-color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: var(--primary-color);
            color: #fff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .total-cell {
            font-weight: bold;
            color: var(--accent-color);
            background-color: #fff3cd;
        }

        .delete-row {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
        }

        .delete-row:hover {
            color: #c0392b;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 10px; }
            table, th, td { font-size: 0.9em; padding: 8px; }
            .controls { flex-direction: column; }
            button { width: 100%; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <h1>سجل متابعة بطلات الاستدامة</h1>
    <h2>حب الوطن بلغة العلوم - رؤية السعودية 2030</h2>

    <div class="container">
        <div class="controls">
            <button id="add-student">+ إضافة طالبة</button>
            <button id="clear-all">مسح الكل</button>
        </div>

        <table id="followup-table">
            <thead>
                <tr>
                    <th>حذف</th>
                    <th style="width: 25%;">اسم الطالبة</th>
                    <th title="من 5 درجات">الركن العلمي</th>
                    <th title="من 5 درجات">تصميم المطويات</th>
                    <th title="من 5 درجات">كتابة العبارات</th>
                    <th title="من 15 درجة">إجمالي الدرجات</th>
                    <th style="width: 25%;">ملاحظات المعلمة</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- سيتم إضافة الصفوف هنا بواسطة الجافا سكريبت -->
            </tbody>
        </table>
    </div>

    <script>
        const tableBody = document.getElementById('table-body');
        const addStudentBtn = document.getElementById('add-student');
        const clearAllBtn = document.getElementById('clear-all');

        // تحميل البيانات عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', loadTableData);

        // إضافة صف جديد
        addStudentBtn.addEventListener('click', addStudentRow);

        // مسح الكل
        clearAllBtn.addEventListener('click', () => {
            if (confirm('هل أنت متأكد من مسح جميع البيانات؟')) {
                localStorage.removeItem('sustainabilityTable');
                tableBody.innerHTML = '';
            }
        });

        // --- الوظائف (Functions) ---

        // إنشاء صف جديد
        function addStudentRow(savedData = null) {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td><button class="delete-row" title="حذف الطالبة">×</button></td>
                <td contenteditable="true" class="editable-name">${savedData ? savedData.name : 'اسم الطالبة'}</td>
                <td><input type="number" min="0" max="5" value="${savedData ? savedData.act1 : 0}" class="score-input"></td>
                <td><input type="number" min="0" max="5" value="${savedData ? savedData.act2 : 0}" class="score-input"></td>
                <td><input type="number" min="0" max="5" value="${savedData ? savedData.act3 : 0}" class="score-input"></td>
                <td class="total-cell">${savedData ? savedData.total : 0}</td>
                <td contenteditable="true" class="editable-note">${savedData ? savedData.note : ''}</td>
            `;

            tableBody.appendChild(row);
            attachRowListeners(row);
            saveTableData(); // حفظ البيانات بعد إضافة صف
        }

        // ربط الأحداث (Listeners) بالصف
        function attachRowListeners(row) {
            const scoreInputs = row.querySelectorAll('.score-input');
            const deleteBtn = row.querySelector('.delete-row');
            const editableCells = row.querySelectorAll('.editable-name, .editable-note');

            // حساب المجموع عند تغيير أي درجة
            scoreInputs.forEach(input => {
                input.addEventListener('input', () => calculateTotal(row));
            });

            // حذف الصف
            deleteBtn.addEventListener('click', () => {
                if (confirm('هل أنت متأكد من حذف هذه الطالبة؟')) {
                    row.remove();
                    saveTableData();
                }
            });

            // حفظ عند التعديل النصي (اسم، ملاحظة)
            editableCells.forEach(cell => {
                cell.addEventListener('input', saveTableData);
            });
        }

        // حساب إجمالي درجات الصف
        function calculateTotal(row) {
            const scoreInputs = row.querySelectorAll('.score-input');
            let total = 0;
            scoreInputs.forEach(input => {
                const score = parseInt(input.value);
                if (!isNaN(score) && score >= 0) {
                    total += Math.min(score, 5); // التأكد من عدم تجاوز 5
                }
            });
            row.querySelector('.total-cell').textContent = total;
            saveTableData();
        }

        // حفظ البيانات إلى LocalStorage
        function saveTableData() {
            const rows = tableBody.querySelectorAll('tr');
            const tableData = [];

            rows.forEach(row => {
                tableData.push({
                    name: row.querySelector('.editable-name').textContent,
                    act1: row.querySelector('td:nth-child(3) input').value,
                    act2: row.querySelector('td:nth-child(4) input').value,
                    act3: row.querySelector('td:nth-child(5) input').value,
                    total: row.querySelector('.total-cell').textContent,
                    note: row.querySelector('.editable-note').textContent
                });
            });

            localStorage.setItem('sustainabilityTable', JSON.stringify(tableData));
        }

        // تحميل البيانات من LocalStorage
        function loadTableData() {
            const savedTableData = localStorage.getItem('sustainabilityTable');
            if (savedTableData) {
                const tableData = JSON.parse(savedTableData);
                tableData.forEach(data => {
                    addStudentRow(data);
                });
            }
        }
    </script>
</body>
</html>
