<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استبيان مبادرة: حب الوطن بلغة العلوم</title>
    <style>
        :root {
            --primary-color: #006b3f; /* أخضر السعودية */
            --secondary-color: #00a651;
            --accent-color: #f39c12; /* لون ذهبي */
            --text-color: #333;
            --bg-color: #f9f9f9;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary-color);
            padding-bottom: 10px;
            width: 100%;
            max-width: 800px;
        }

        h1 { color: var(--primary-color); margin: 0; }
        h2 { color: var(--secondary-color); font-weight: normal; margin: 5px 0; }
        h3 { color: var(--text-color); margin-top: 10px; }

        .survey-container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .question-group {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: #fff;
        }

        .question-group:hover {
            border-color: var(--secondary-color);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .radio-label {
            display: inline-block;
            margin-left: 20px;
            font-weight: normal;
            cursor: pointer;
        }

        input[type="radio"] {
            margin-left: 10px;
            transform: scale(1.2);
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            resize: none;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: var(--secondary-color);
        }

        .vision-logo {
            max-width: 150px;
            margin-top: 10px;
        }
        
        .q-desc {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: block;
        }

        @media (max-width: 600px) {
            .survey-container { padding: 15px; }
            .radio-label { display: block; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>استبيان قياس أثر مبادرة: حب الوطن بلغة العلوم</h1>
        <h2>رؤية السعودية 2030 - جيل واعٍ ومستدام</h2>
        <img src="https://www.vision2030.gov.sa/media/uy3la35n/vision_2030_ar.svg" alt="شعار رؤية السعودية 2030" class="vision-logo">
    </div>

    <div class="survey-container">

        <div class="question-group">
            <label>الاسم الثلاثي (اختياري):</label>
            <input type="text" placeholder="أدخلي اسمك هنا...">
        </div>

        <div class="question-group">
            <label>المرحلة الدراسية:</label>
            <label class="radio-label"><input type="radio" name="stage" value="primary"> الابتدائية</label>
        </div>

        <h3>أولاً: تقييم محاور المبادرة</h3>

        <div class="question-group">
            <label>1. هل فهمتِ كيف يخدم العلم وطننا السعودية في مجال ترشيد استهلاك المياه والطاقة؟</label>
            <span class="q-desc">من خلال ما تعلمته في الركن العلمي والمطويات</span>
            <label class="radio-label"><input type="radio" name="q1" value="yes"> نعم، بوضوح</label>
            <label class="radio-label"><input type="radio" name="q1" value="partially"> إلى حد ما</label>
            <label class="radio-label"><input type="radio" name="q1" value="no"> لا</label>
        </div>

        <div class="question-group">
            <label>2. هل قمتِ بتطبيق سلوكيات ترشيد الماء أو الكهرباء في المدرسة بعد المشاركة في المبادرة؟</label>
            <span class="q-desc">مثال: إغلاق الصنبور، إطفاء النور عند الخروج</span>
            <label class="radio-label"><input type="radio" name="q2" value="always"> نعم، دائماً</label>
            <label class="radio-label"><input type="radio" name="q2" value="sometimes"> أحياناً</label>
            <label class="radio-label"><input type="radio" name="q2" value="never"> لم أطبقها</label>
        </div>

        <div class="question-group">
            <label>3. هل أصبح لديكِ وعي بأهمية إعادة التدوير لحماية بيئة ومقدرات الوطن؟</label>
            <label class="radio-label"><input type="radio" name="q3" value="yes"> نعم، بشكل كبير</label>
            <label class="radio-label"><input type="radio" name="q3" value="partially"> نعم، قليل</label>
            <label class="radio-label"><input type="radio" name="q3" value="no"> لا</label>
        </div>

        <h3>ثانياً: الاعتزاز الوطني والعلوم</h3>

        <div class="question-group">
            <label>4. هل شعرتِ بالفخر عند المشاركة في فقرة "كتابة العبارات الوطنية" التي تربط العلم بحب الوطن؟</label>
            <label class="radio-label"><input type="radio" name="q4" value="yes"> نعم، جداً</label>
            <label class="radio-label"><input type="radio" name="q4" value="no"> لا</label>
        </div>

        <div class="question-group">
            <label>5. هل تتمنين أن تصبحي عالمة أو مهندسة سعودية تساهم في تطوير وخدمة الوطن مستقبلاً؟</label>
            <label class="radio-label"><input type="radio" name="q5" value="yes"> نعم، أتمنى</label>
            <label class="radio-label"><input type="radio" name="q5" value="maybe"> ممكن</label>
            <label class="radio-label"><input type="radio" name="q5" value="no"> لا</label>
        </div>

        <div class="question-group">
            <label>كلمة أخيرة أو اقتراح منكِ لتطوير المبادرة:</label>
            <textarea placeholder="اكتبي رأيك هنا..."></textarea>
        </div>

        <button class="submit-btn">إرسال الاستبيان</button>

    </div>

</body>
</html>
